
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lucky World | My World</title>

    <!-- 기존 로또 디자인 -->
    <link rel="stylesheet"
          th:href="@{/css/lotto.css}"
          href="/css/lotto.css">

    <!-- 공통 양방향 화살표 -->
    <link rel="stylesheet"
          th:href="@{/css/page-arrows.css}"
          href="/css/page-arrows.css">

    <!-- 기존 로또 추첨 기능 -->
    <script th:src="@{/js/lotto.js}"
            src="/js/lotto.js"
            defer></script>
</head>

<body>

<!-- ========================================
     공통 페이지 이동 화살표
     lucky-page 바깥으로 이동
======================================== -->

<!-- 왼쪽 : 로그인 화면 -->
<a class="page-nav-arrow page-nav-left"
   th:href="@{/login}"
   href="/login"
   aria-label="로그인 화면으로 이동"
   title="로그인">

    <span class="arrow-symbol">❮</span>
    <small>WORKSPACE</small>

</a>

<!-- 오른쪽 : 홈 화면 -->
<a class="page-nav-arrow page-nav-right"
   th:href="@{/home}"
   href="/home"
   aria-label="홈 화면으로 이동"
   title="홈">

    <span class="arrow-symbol">❯</span>
    <small>MBTI</small>

</a>

<!-- ========================================
     로또 페이지
======================================== -->

<div class="lucky-page">

    <!-- 상단 헤더 -->
    <header class="lucky-header">

        <a class="brand"
           th:href="@{/home}"
           href="/home">
            MY WORLD
        </a>

        <span class="page-label">
            LUCKY WORLD · 02
        </span>

    </header>

    <main class="lucky-main">

        <!-- 장식용 레고 블록 -->
        <div class="decor-bricks"
             aria-hidden="true">

            <span class="decor-brick yellow"></span>
            <span class="decor-brick red"></span>
            <span class="decor-brick blue"></span>
            <span class="decor-brick green"></span>

        </div>

        <p class="eyebrow">
            BUILD YOUR LUCK!
        </p>

        <h1>🍀 LUCKY BLOCK</h1>

        <p class="intro">
            알록달록한 공들이 행운의 번호를 골라줄 거야!
        </p>

        <!-- 로또 추첨기 -->
        <section class="lotto-machine"
                 aria-label="로또 번호 추첨기">

            <div class="machine-title">

                <span class="machine-light"></span>

                LOTTO 6/45

                <span class="machine-light"></span>

            </div>

            <!-- 투명한 공 추첨 공간 -->
            <div id="ballChamber"
                 class="ball-chamber">

                <div id="floatingBalls"
                     class="floating-balls">
                </div>

                <span class="chamber-shine"></span>

            </div>

            <!-- 공이 나오는 통로 -->
            <div class="machine-neck"></div>

            <div class="machine-base">

                <div class="base-studs">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="machine-status"
                     id="machineStatus">
                    READY TO PLAY!
                </div>

                <div class="base-studs">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>

        </section>

        <!-- 추첨 결과 -->
        <section class="result-panel">

            <h2>✨ 오늘의 행운 번호</h2>

            <div class="result-balls"
                 id="resultBalls"
                 aria-live="polite">

                <div class="result-ball empty">?</div>
                <div class="result-ball empty">?</div>
                <div class="result-ball empty">?</div>
                <div class="result-ball empty">?</div>
                <div class="result-ball empty">?</div>
                <div class="result-ball empty">?</div>

                <span class="plus-sign">+</span>

                <div class="result-ball empty bonus">?</div>

            </div>

            <p class="bonus-guide">
                마지막 공은 보너스 번호야!
            </p>

        </section>

        <!-- 추첨 버튼 -->
        <button type="button"
                id="drawButton"
                class="draw-button">
            🎱 추첨 시작!
        </button>

        <p id="drawMessage"
           class="draw-message"
           aria-live="polite">
            버튼을 누르고 행운의 번호를 만나봐!
        </p>

        <p class="disclaimer">
            이 번호는 무작위로 생성되며
            실제 로또 당첨을 예측하지 않아.
        </p>

    </main>

    <footer class="lucky-footer">
        MADE WITH 💛 · MY WORLD
    </footer>

</div>

</body>
</html>
