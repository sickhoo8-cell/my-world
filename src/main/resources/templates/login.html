
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>로그인 | My World</title>

    <style>
        /* ==========================================
           MY WORLD | LOGIN
           DARK MODERN PURPLE
           Workspace Color System
        ========================================== */

        :root {
            color-scheme: dark;

            --bg: #101118;
            --sidebar-bg: #171821;

            --card: #1e202b;
            --card-inner: #272a37;
            --card-hover: #303344;

            --input-bg: #171923;

            --border: #373a4b;
            --border-active: #8364ed;

            --primary: #825cf0;
            --primary-hover: #9878fa;
            --primary-soft: #352c50;

            --text: #f4f3f8;
            --text-secondary: #c5c3d2;
            --text-muted: #a5a3b7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                    "Pretendard",
                    "Malgun Gothic",
                    sans-serif;

            color: var(--text);

            background:
                    radial-gradient(
                            circle at 15% 15%,
                            #28203b,
                            transparent 35%
                    ),
                    linear-gradient(
                            135deg,
                            #101118,
                            #181724,
                            #101118
                    );
        }

        /* ==========================================
           전체 페이지
        ========================================== */

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 90px;
        }

        .login-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;

            width: 100%;
            max-width: 1080px;
            min-height: 610px;

            overflow: hidden;

            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 30px;

            box-shadow:
                    0 22px 65px rgba(0, 0, 0, 0.35);
        }

        /* ==========================================
           페이지 이동 화살표
        ========================================== */

        .page-arrow {
            position: fixed;

            top: 50%;
            transform: translateY(-50%);

            z-index: 1000;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 8px;

            width: 68px;
            min-height: 86px;
            padding: 10px 5px;

            border: 1px solid #50456c;
            border-radius: 20px;

            background: rgba(30, 32, 43, 0.96);

            color: #d5c5ff;
            text-decoration: none;

            box-shadow:
                    0 8px 24px rgba(0, 0, 0, 0.25);

            transition:
                    background 0.2s,
                    box-shadow 0.2s;
        }

        .page-arrow:hover {
            background: var(--primary-soft);

            box-shadow:
                    0 10px 26px rgba(0, 0, 0, 0.35);
        }

        .page-arrow .arrow-symbol {
            font-size: 30px;
            line-height: 1;
        }

        .page-arrow small {
            font-size: 9px;
            font-weight: bold;

            text-align: center;
            letter-spacing: 0.3px;
        }

        .page-arrow-left {
            left: 15px;
        }

        .page-arrow-right {
            right: 15px;
        }

        /* ==========================================
           페른 사진 갤러리
           기존 사진 위치 그대로 유지
        ========================================== */

        .fern-gallery {
            position: relative;

            min-height: 610px;
            overflow: hidden;

            background:
                    radial-gradient(
                            circle at 35% 35%,
                            #43345d,
                            transparent 48%
                    ),
                    linear-gradient(
                            145deg,
                            #302544,
                            #201e30
                    );
        }

        .gallery-label {
            position: absolute;

            top: 28px;
            left: 28px;

            z-index: 10;

            color: #d3c3ff;

            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .photo {
            position: absolute;

            overflow: hidden;
            padding: 7px;

            background: #353044;

            border: 1px solid #615078;
            border-radius: 14px;

            box-shadow:
                    0 12px 28px rgba(0, 0, 0, 0.32);

            transition: transform 0.25s ease;
        }

        .photo img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;
            border-radius: 8px;
        }

        .main-photo {
            z-index: 2;

            top: 105px;
            left: 8%;

            width: 58%;
            height: 385px;

            transform: rotate(-5deg);
        }

        .night-photo {
            z-index: 3;

            top: 75px;
            right: 6%;

            width: 35%;
            height: 195px;

            transform: rotate(8deg);
        }

        .back-photo {
            z-index: 4;

            right: 6%;
            bottom: 36px;

            width: 37%;
            height: 260px;

            transform: rotate(5deg);
        }

        .couple-photo {
            z-index: 5;

            left: 6%;
            bottom: 23px;

            width: 38%;
            height: 170px;

            transform: rotate(-8deg);
        }

        .main-photo:hover {
            transform:
                    rotate(-2deg)
                    translateY(-6px);
        }

        .night-photo:hover,
        .back-photo:hover,
        .couple-photo:hover {
            transform:
                    rotate(0deg)
                    translateY(-6px);
        }

        .gallery-bottom {
            position: absolute;

            right: 25px;
            bottom: 10px;

            font-size: 11px;
            color: #c3b3db;

            letter-spacing: 2px;
        }

        /* ==========================================
           로그인 폼
        ========================================== */

        .form-panel {
            padding: 65px 48px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            background: var(--card);
        }

        .home-link {
            align-self: flex-start;

            margin-bottom: 42px;

            color: var(--text-muted);

            font-size: 13px;
            text-decoration: none;

            transition: color 0.2s;
        }

        .home-link:hover {
            color: #c6b3ff;
        }

        .small-title {
            margin: 0 0 8px;

            color: #bca5ff;

            font-size: 12px;
            letter-spacing: 3px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 12px;

            color: var(--text);

            font-size: 36px;
            font-weight: 900;
        }

        .subtitle {
            margin: 0 0 35px;

            color: var(--text-secondary);

            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 21px;
        }

        label {
            display: block;
            margin-bottom: 9px;

            color: var(--text-secondary);

            font-weight: bold;
            font-size: 14px;
        }

        input {
            display: block;

            width: 100%;
            padding: 15px;

            border: 1px solid #45495f;
            border-radius: 12px;

            background: var(--input-bg);
            color: var(--text);

            font-size: 15px;
            outline: none;

            transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--border-active);

            box-shadow:
                    0 0 0 4px rgba(130, 92, 240, 0.17);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        /* ==========================================
           로그인 버튼
        ========================================== */

        .login-button {
            width: 100%;

            padding: 16px;
            margin-top: 14px;

            border: none;
            border-radius: 13px;

            background: linear-gradient(
                    135deg,
                    #825cf0,
                    #6744c7
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                    background 0.2s,
                    box-shadow 0.2s;
        }

        .login-button:hover {
            background: var(--primary-hover);

            box-shadow:
                    0 6px 20px rgba(130, 92, 240, 0.25);
        }

        .login-button:focus-visible,
        input:focus-visible,
        a:focus-visible {
            outline: 2px solid #b6a1ff;
            outline-offset: 3px;
        }

        /* ==========================================
           회원가입 안내
        ========================================== */

        .signup-guide {
            margin-top: 25px;

            text-align: center;

            font-size: 13px;
            color: var(--text-secondary);
        }

        .signup-guide a {
            color: #c6b3ff;

            font-weight: bold;
            text-decoration: none;
        }

        .signup-guide a:hover {
            color: #e1d8ff;
            text-decoration: underline;
        }

        /* ==========================================
           로그인 메시지
           오류 / 로그아웃 완료
        ========================================== */

        .message {
            padding: 13px;

            border-radius: 11px;
            margin-bottom: 22px;

            font-size: 13px;
            line-height: 1.6;

            border: 1px solid transparent;
        }

        .error {
            background: #422b3b;
            border-color: #764459;

            color: #ffc0cb;
        }

        .success {
            background: #342b4c;
            border-color: #67508f;

            color: #d5c6ff;
        }

        /* ==========================================
           태블릿 / 모바일
           기존 반응형 유지
        ========================================== */

        @media (max-width: 800px) {
            .page {
                padding: 85px 18px;
            }

            .login-layout {
                grid-template-columns: 1fr;
                max-width: 520px;
            }

            .fern-gallery {
                min-height: 320px;
            }

            .main-photo {
                top: 60px;
                height: 235px;
            }

            .night-photo {
                top: 40px;
                height: 130px;
            }

            .back-photo {
                height: 150px;
                bottom: 12px;
            }

            .couple-photo {
                height: 105px;
                bottom: 8px;
            }

            .form-panel {
                padding: 36px 27px;
            }

            .home-link {
                margin-bottom: 28px;
            }

            .page-arrow {
                top: 12px;
                transform: none;

                width: 88px;
                min-height: 53px;

                flex-direction: row;
                gap: 5px;

                border-radius: 13px;
            }

            .page-arrow-left {
                left: 12px;
            }

            .page-arrow-right {
                right: 12px;
            }

            .page-arrow .arrow-symbol {
                font-size: 22px;
            }

            .page-arrow small {
                font-size: 9px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .photo,
            .page-arrow {
                transition: none;
            }
        }
    </style>
</head>


<body>

<!-- 왼쪽 : 기존 겨울 마이월드 -->
<a class="page-arrow page-arrow-left"
   th:href="@{/home}"
   href="/home"
   aria-label="마이월드 홈페이지로 이동"
   title="마이월드">
    <span class="arrow-symbol">❮</span>
    <small>MY WORLD</small>
</a>

<!-- 오른쪽 : 로또 -->
<a class="page-arrow page-arrow-right"
   th:href="@{/lotto}"
   href="/lotto"
   aria-label="로또 추첨 페이지로 이동"
   title="로또">
    <small>LOTTO</small>
    <span class="arrow-symbol">❯</span>
</a>

<main class="page">
    <div class="login-layout">

        <!-- 기존 페른 사진 4장 -->
        <section class="fern-gallery">

            <span class="gallery-label">
                MY WORLD ♡
            </span>

            <div class="photo main-photo">
                <img th:src="@{/img/fern1.png}"
                     src="/img/fern1.png"
                     alt="페른 메인 사진">
            </div>

            <div class="photo night-photo">
                <img th:src="@{/img/fern3.png}"
                     src="/img/fern3.png"
                     alt="페른 밤 사진">
            </div>

            <div class="photo back-photo">
                <img th:src="@{/img/fern2.png}"
                     src="/img/fern2.png"
                     alt="페른 뒷모습 사진">
            </div>

            <div class="photo couple-photo">
                <img th:src="@{/img/fern.png}"
                     src="/img/fern.png"
                     alt="페른과 슈타르크 사진">
            </div>

            <span class="gallery-bottom">
                FERN COLLECTION
            </span>

        </section>

        <!-- 오른쪽 로그인 폼 -->
        <section class="form-panel">

            <a class="home-link"
               th:href="@{/home}"
               href="/home">
                ← 마이월드 둘러보기
            </a>

            <p class="small-title">
                MY WORLD · MEMBER
            </p>

            <h1>로그인 ♡</h1>

            <p class="subtitle">
                아이디와 비밀번호를 입력해 주세요.
            </p>

            <!-- 로그인 오류 -->
            <div class="message error"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <!-- 로그아웃 성공 -->
            <div class="message success"
                 th:if="${param.logout}">
                로그아웃되었습니다.
            </div>

            <!-- 회원가입 성공 -->
            <div class="message success"
                 th:if="${param.signupSuccess}">
                🎉 회원가입이 완료되었습니다!
                로그인해 주세요. 💜
            </div>

            <form th:action="@{/login}"
                  th:object="${loginForm}"
                  method="post">

                <div class="form-group">
                    <label for="username">
                        아이디
                    </label>

                    <input type="text"
                           id="username"
                           th:field="*{username}"
                           autocomplete="username"
                           placeholder="아이디를 입력하세요"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">
                        비밀번호
                    </label>

                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           autocomplete="current-password"
                           placeholder="비밀번호를 입력하세요"
                           required>
                </div>

                <button type="submit"
                        class="login-button">
                    로그인하기
                </button>
            </form>

            <p class="signup-guide">
                아직 회원이 아니신가요?

                <a th:href="@{/signup}"
                   href="/signup">
                    회원가입
                </a>
            </p>

        </section>
    </div>
</main>

</body>
</html>
