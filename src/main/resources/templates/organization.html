
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>사내 조직도 | MY WORLD</title>

    <style>
        :root {
            color-scheme: dark;

            --bg: #101118;
            --panel: #1e202b;
            --inner: #272a37;
            --border: #373a4b;

            --primary: #825cf0;
            --primary-soft: #352c50;

            --text: #f4f3f8;
            --secondary: #c5c3d2;
            --muted: #a5a3b7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: var(--bg);
            color: var(--text);

            font-family:
                    "Pretendard",
                    "Malgun Gothic",
                    sans-serif;
        }

        a {
            color: inherit;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 30px 24px 70px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            color: #d8c7ff;
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .top-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 39px;
            padding: 9px 15px;

            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 9px;

            color: var(--secondary);
            text-decoration: none;

            font-size: 12px;
            font-weight: 700;
        }

        .top-link:hover {
            color: #ffffff;
            border-color: var(--primary);
        }

        .heading {
            margin: 32px 0 24px;
        }

        .eyebrow {
            margin: 0 0 9px;

            color: #bda8ff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 29px;
        }

        .description {
            margin: 0;
            color: var(--secondary);
            font-size: 13px;
            line-height: 1.7;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 22px;
        }

        .summary-card {
            padding: 22px;

            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .summary-card span {
            display: block;
            color: var(--muted);
            font-size: 12px;
        }

        .summary-card strong {
            display: block;
            margin-top: 7px;

            color: #d8c7ff;
            font-size: 29px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;

            margin-bottom: 23px;
            padding: 19px;

            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .search {
            width: 100%;
            max-width: 440px;
            min-height: 44px;
            padding: 11px 14px;

            background: #171923;
            border: 1px solid #45495f;
            border-radius: 10px;

            color: var(--text);
            outline: none;
            font: inherit;
            font-size: 13px;
        }

        .search::placeholder {
            color: var(--muted);
        }

        .search:focus {
            border-color: var(--primary);
            box-shadow:
                    0 0 0 3px rgba(130, 92, 240, .16);
        }

        .search-count {
            color: var(--muted);
            font-size: 12px;
        }

        .department-section {
            margin-bottom: 23px;
            padding: 23px;

            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 15px;
        }

        .department-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;

            margin-bottom: 18px;
            padding-bottom: 15px;

            border-bottom: 1px solid var(--border);
        }

        .department-title {
            margin: 0;
            color: #e0d5ff;
            font-size: 18px;
        }

        .department-count {
            color: var(--muted);
            font-size: 12px;
        }

        .employee-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 13px;
        }

        .employee-card {
            min-width: 0;
            padding: 20px;

            background: var(--inner);
            border: 1px solid #403e50;
            border-radius: 12px;

            transition:
                    border-color .2s,
                    background .2s;
        }

        .employee-card:hover {
            border-color: #8265c5;
            background: #2c2c3d;
        }

        .employee-top {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 0;
        }

        .avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;

            width: 49px;
            height: 49px;

            background: var(--primary-soft);
            border: 1px solid #594788;
            border-radius: 13px;

            color: #d8c7ff;
            font-size: 19px;
            font-weight: 800;
        }

        .employee-info {
            min-width: 0;
        }

        .employee-name {
            margin: 0 0 5px;
            font-size: 15px;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .employee-position {
            margin: 0;
            color: var(--secondary);
            font-size: 12px;
        }

        .employee-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;

            margin-top: 19px;
            padding-top: 15px;

            border-top: 1px solid #403e50;
        }

        .employee-department {
            color: var(--muted);
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .message-link {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 9px 13px;

            background: var(--primary-soft);
            border: 1px solid #594788;
            border-radius: 8px;

            color: #d8c7ff;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }

        .message-link:hover {
            background: #49396e;
        }

        .empty {
            padding: 35px 20px;

            background: var(--panel);
            border: 1px dashed #45495f;
            border-radius: 14px;

            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .note {
            margin-top: 18px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.8;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 900px) {
            .employee-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px 13px 50px;
            }

            .topbar {
                flex-wrap: wrap;
            }

            .heading {
                margin-top: 24px;
            }

            h1 {
                font-size: 23px;
            }

            .summary-card {
                padding: 17px;
            }

            .department-section {
                padding: 15px;
            }

            .employee-grid {
                grid-template-columns: 1fr;
            }

            .toolbar {
                padding: 13px;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <!-- 상단 메뉴 -->

    <header class="topbar">

        <div class="brand">
            MY WORLD / ORGANIZATION
        </div>

        <a class="top-link"
           th:href="@{/workspace}"
           href="/workspace">
            Workspace로 돌아가기
        </a>

    </header>

    <!-- 페이지 제목 -->

    <section class="heading">

        <p class="eyebrow">
            EMPLOYEE DIRECTORY
        </p>

        <h1>사내 조직도</h1>

        <p class="description">
            부서별 직원 정보를 확인하고
            사내 메신저로 이동할 수 있습니다.
        </p>

    </section>

    <!-- 직원 및 부서 통계 -->

    <section class="summary">

        <div class="summary-card">

            <span>전체 직원</span>

            <strong th:text="${employeeCount}">
                0
            </strong>

        </div>

        <div class="summary-card">

            <span>직원 소속 그룹</span>

            <strong th:text="${departmentCount}">
                0
            </strong>

        </div>

    </section>

    <!-- 검색 -->

    <section class="toolbar">

        <input id="employeeSearch"
               class="search"
               type="search"
               placeholder="이름, 아이디, 부서, 직급 검색"
               aria-label="직원 검색">

        <span id="searchCount"
              class="search-count">
            직원 검색
        </span>

    </section>

    <!-- 부서별 직원 목록 -->

    <section class="department-section"
             th:each="group : ${departmentGroups}">

        <div class="department-heading">

            <h2 class="department-title"
                th:text="${group.name}">
                개발팀
            </h2>

            <span class="department-count"
                  th:text="|${#lists.size(group.employees)}명|">
                0명
            </span>

        </div>

        <div class="employee-grid">

            <article class="employee-card"
                     th:each="employee : ${group.employees}"
                     th:attr="data-keywords=|${employee.nickname} ${employee.username} ${employee.department} ${employee.position}|">

                <div class="employee-top">

                    <div class="avatar"
                         aria-hidden="true"
                         th:text="${#strings.substring(employee.nickname, 0, 1)}">
                        김
                    </div>

                    <div class="employee-info">

                        <h3 class="employee-name"
                            th:text="${employee.nickname}">
                            홍길동
                        </h3>

                        <p class="employee-position"
                           th:text="${employee.position}">
                            대리
                        </p>

                    </div>

                </div>

                <div class="employee-bottom">

                    <span class="employee-department"
                          th:text="${employee.department}">
                        개발팀
                    </span>

                    <a class="message-link"
                       th:if="${employee.id != loginMemberId}"
                       th:href="@{/messenger}"
                       href="/messenger">
                        메신저 열기
                    </a>

                    <span class="employee-department"
                          th:if="${employee.id == loginMemberId}">
                        나
                    </span>

                </div>

            </article>

        </div>

    </section>

    <!-- 직원이 없는 경우 -->

    <div class="empty"
         th:if="${#lists.isEmpty(departmentGroups)}">
        현재 표시할 직원이 없습니다.
    </div>

    <!-- 검색 결과가 없는 경우 -->

    <div class="empty"
         id="noSearchResults"
         hidden>
        검색 결과가 없습니다.
    </div>

    <p class="note">
        관리자 승인 대기 중이거나
        이용이 정지된 회원은 조직도에 표시되지 않습니다.
        메신저에서 대화 상대를 선택할 수 있습니다.
    </p>

</main>

<script>
    "use strict";

    const searchInput =
        document.getElementById("employeeSearch");

    const cards =
        document.querySelectorAll(".employee-card");

    const sections =
        document.querySelectorAll(".department-section");

    const countElement =
        document.getElementById("searchCount");

    const emptyElement =
        document.getElementById("noSearchResults");

    function filterEmployees() {

        const keyword =
            searchInput.value.trim().toLowerCase();

        let visibleCount = 0;

        sections.forEach(function (section) {

            const sectionCards =
                section.querySelectorAll(".employee-card");

            let visibleInSection = 0;

            sectionCards.forEach(function (card) {

                const keywords =
                    (card.dataset.keywords || "")
                        .toLowerCase();

                const matched =
                    keywords.includes(keyword);

                card.hidden = !matched;

                if (matched) {
                    visibleInSection++;
                    visibleCount++;
                }
            });

            section.hidden =
                visibleInSection === 0;
        });

        countElement.textContent =
            visibleCount + "명 표시";

        emptyElement.hidden =
            visibleCount !== 0
            || cards.length === 0;
    }

    searchInput.addEventListener(
        "input",
        filterEmployees
    );

    filterEmployees();
</script>

</body>
</html>
