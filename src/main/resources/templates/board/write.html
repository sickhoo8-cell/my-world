
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My World - 글쓰기</title>
</head>
<body>
<h1>게시글 작성</h1>

<form th:action="@{/board/write}"
      th:object="${boardDTO}"
      method="post">

    <div>
        <label for="title">제목</label>
        <input id="title" type="text"
               th:field="*{title}" maxlength="200">

        <p th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}"></p>
    </div>

    <div>
        <label for="content">내용</label>
        <textarea id="content"
                  th:field="*{content}"
                  maxlength="2000"
                  rows="8"></textarea>

        <p th:if="${#fields.hasErrors('content')}"
           th:errors="*{content}"></p>
    </div>

    <button type="submit">저장하기</button>
    <a th:href="@{/board}">목록으로</a>
</form>
</body>
</html>
