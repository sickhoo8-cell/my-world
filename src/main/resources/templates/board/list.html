
<!-- 로그인 회원 정보 -->
<div class="board-member-box">

    <!-- 로그인한 경우 -->
    <div th:if="${loginMemberId != null}" class="member-logged-in">

        <span class="member-welcome">
            💜 <strong th:text="${loginNickname}">닉네임</strong>님,
            환영합니다!
        </span>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="member-logout-btn">
                로그아웃
            </button>
        </form>

    </div>

    <!-- 로그인하지 않은 경우 -->
    <div th:unless="${loginMemberId != null}"
         class="member-guest">

        <span>게시판에 오신 것을 환영합니다.</span>

        <div class="member-links">
            <a th:href="@{/login}">로그인</a>
            <a th:href="@{/signup}">회원가입</a>
        </div>

    </div>

</div>
