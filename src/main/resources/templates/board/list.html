<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My World - 게시판</title>
</head>
<body>
<h1>My World 게시판</h1>

<a th:href="@{/board/write}">글쓰기</a>

<hr>

<div th:if="${#lists.isEmpty(boards)}">
    아직 작성된 게시글이 없습니다.
</div>

<div th:each="board : ${boards}">
    <h3>
        <a th:href="@{/board/{id}(id=${board.id})}"
           th:text="${board.title}">
            제목
        </a>
    </h3>
    <p th:text="${board.content}"
       style="white-space: pre-wrap;">내용</p>
    <hr>
</div>
</body>
</html>
