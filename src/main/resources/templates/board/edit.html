<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My World - 게시글 수정</title>
</head>
<body>

<h1>게시글 수정</h1>

<form th:action="@{/board/{id}/edit(id=${boardId})}"
      th:object="${boardDTO}"
      method="post">

    <div>
        <label for="title">제목</label>
        <input id="title" type="text"
               th:field="*{title}" maxlength="200">

        <p th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}"></p>
    </div>

    <div>
        <label for="content">내용</label>
        <textarea id="content"
                  th:field="*{content}"
                  maxlength="2000"
                  rows="8"></textarea>

        <p th:if="${#fields.hasErrors('content')}"
           th:errors="*{content}"></p>
    </div>

    <button type="submit">수정 완료</button>
    <a th:href="@{/board/{id}(id=${boardId})}">취소</a>

</form>

</body>
</html>
