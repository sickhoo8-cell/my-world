
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>내 정보 | MY WORLD</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101118;
            color: #f4f3f8;
            font-family: "Pretendard", "Malgun Gothic", sans-serif;
        }

        a {
            text-decoration: none;
        }

        .page {
            max-width: 1100px;
            margin: auto;
            padding: 30px 22px 70px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 22px;
            border-bottom: 1px solid #373a4b;
        }

        .brand {
            color: #d8c7ff;
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .back-link {
            padding: 11px 16px;
            border: 1px solid #45495f;
            border-radius: 9px;
            color: #d5d3df;
            font-size: 13px;
        }

        .intro {
            margin: 38px 0 28px;
        }

        .eyebrow {
            color: #bda8ff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        h1 {
            margin: 10px 0;
            font-size: 30px;
        }

        .description {
            color: #aaa8ba;
            font-size: 13px;
            line-height: 1.7;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 27px;
            background: #1e202b;
            border: 1px solid #373a4b;
            border-radius: 17px;
        }

        .avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 75px;
            height: 75px;
            flex-shrink: 0;
            border-radius: 22px;
            background: #352c50;
            color: #d8c7ff;
            font-size: 30px;
            font-weight: 900;
        }

        .profile-name {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .profile-id {
            color: #aaa8ba;
            font-size: 13px;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 10px;
            background: #173b32;
            color: #8de0bb;
            border-radius: 20px;
            font-size: 11px;
        }

        .section {
            margin-top: 23px;
            padding: 26px;
            background: #1e202b;
            border: 1px solid #373a4b;
            border-radius: 15px;
        }

        .section h2 {
            margin: 0 0 22px;
            font-size: 17px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .info-item {
            padding: 15px;
            background: #272a37;
            border-radius: 10px;
        }

        .info-label {
            display: block;
            margin-bottom: 9px;
            color: #aaa8ba;
            font-size: 12px;
        }

        .info-value {
            color: #f4f3f8;
            font-size: 14px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .notice {
            margin-top: 20px;
            padding: 15px;
            background: #272a37;
            border-radius: 10px;
            color: #aaa8ba;
            font-size: 12px;
            line-height: 1.8;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 23px;
        }

        .edit-button {
            padding: 13px 23px;
            background: #825cf0;
            border-radius: 9px;
            color: white;
            font-size: 13px;
            font-weight: 800;
        }

        .edit-button:hover {
            background: #7048df;
        }

        @media (max-width: 600px) {
            .page {
                padding: 20px 14px 50px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .profile {
                padding: 19px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- 상단 -->

    <header class="header">

        <a th:href="@{/workspace}"
           href="/workspace"
           class="brand">
            MY WORLD
        </a>

        <a th:href="@{/workspace}"
           href="/workspace"
           class="back-link">
            Workspace 돌아가기
        </a>

    </header>

    <!-- 제목 -->

    <section class="intro">

        <p class="eyebrow">ACCOUNT / PROFILE</p>

        <h1>내 정보</h1>

        <p class="description">
            MY WORLD에 등록된 나의 회원정보를 확인할 수 있습니다.
        </p>

    </section>

    <!-- 프로필 -->

    <section class="profile">

        <div class="avatar"
             th:text="${#strings.substring(member.nickname, 0, 1)}">
            홍
        </div>

        <div>

            <h2 class="profile-name"
                th:text="${member.nickname}">
                홍길동
            </h2>

            <div class="profile-id">
                ID :
                <span th:text="${member.username}">
                    myworld01
                </span>
            </div>

            <span class="status">
                계정 이용 가능
            </span>

        </div>

    </section>

    <!-- 회원 기본정보 -->

    <section class="section">

        <h2>회원 기본정보</h2>

        <div class="info-grid">

            <div class="info-item">

                <span class="info-label">로그인 아이디</span>

                <span class="info-value"
                      th:text="${member.username}">
                    myworld01
                </span>

            </div>

            <div class="info-item">

                <span class="info-label">닉네임</span>

                <span class="info-value"
                      th:text="${member.nickname}">
                    홍길동
                </span>

            </div>

            <div class="info-item">

                <span class="info-label">소속 부서</span>

                <span class="info-value"
                      th:text="${member.department != null
                      ? member.department.name : '미배정'}">
                    개발팀
                </span>

            </div>

            <div class="info-item">

                <span class="info-label">직급</span>

                <span class="info-value"
                      th:text="${member.position != null
                      ? member.position : '미배정'}">
                    사원
                </span>

            </div>

            <div class="info-item">

                <span class="info-label">지역</span>

                <span class="info-value"
                      th:text="${member.region != null
                      ? member.region : '미등록'}">
                    서울특별시
                </span>

            </div>

            <div class="info-item">

                <span class="info-label">가입일</span>

                <span class="info-value"
                      th:text="${#temporals.format(
                      member.createdAt, 'yyyy-MM-dd')}">
                    2026-11-23
                </span>

            </div>

        </div>

        <div class="notice">
            부서 및 직급은 관리자가 관리합니다.
            회원은 본인의 닉네임, 비밀번호, 지역을 수정할 수 있도록
            다음 개발 단계에서 연결할 예정입니다.
        </div>

        <div class="actions">

            <a href="#"
               class="edit-button"
               onclick="alert('회원정보 수정 기능은 다음 단계에서 연결됩니다.'); return false;">
                내 정보 수정
            </a>

        </div>

    </section>

</div>

</body>
</html>
